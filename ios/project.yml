name: ExpenseTracker
options:
  bundleIdPrefix: com.carlosmts
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ExpenseTracker/Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Finbond
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Finbond connects to your local backend server to sync transactions."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carlosmts.expensetracker
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
